<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>aifiler | AI-Powered Filesystem Assistant</title>
    <meta name="description" content="An interactive web terminal demo for aifiler, the AI-powered filesystem assistant.">
    <!-- Google Fonts: Cascadia Code - Using JetBrains Mono as fallback -->
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Outfit:wght@300;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="web/style.css">
</head>
<body>
    <div id="terminal-container">
        <div id="terminal-header">
            <div class="header-buttons">
                <span class="dot close"></span>
                <span class="dot minimize"></span>
                <span class="dot maximize"></span>
            </div>
            <div class="header-title">Windows PowerShell | aifiler</div>
        </div>
        <div id="terminal-body">
            <pre id="ascii-art"></pre>
            <div id="terminal-output"></div>
            <div id="prompt-container">
                <span class="prompt-prefix">PS D:\Projects\aifiler></span>
                <input type="text" id="terminal-input" autofocus autocomplete="off">
            </div>
        </div>
    </div>

    <!-- Floating Action Buttons for quick demo -->
    <div id="demo-controls">
        <button class="demo-btn" onclick="runDemo('help')">Help</button>
        <button class="demo-btn" onclick="runDemo('aifiler plan')">Plan</button>
        <button class="demo-btn" onclick="runDemo('aifiler status')">Status</button>
    </div>

    <script src="web/ascii_art.js"></script>
    <script src="web/main.js"></script>
</body>
</html>
