version: 2
project_name: aifiler

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: aifiler
    main: ./cmd/aifiler
    binary: aifiler
    env:
      - CGO_ENABLED=0
    goos:
      - windows
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

release:
  draft: true

scoops:
  - name: aifiler
    repository:
      owner: JoshiMinh
      name: aifiler
      branch: main
      token: "{{ .Env.GITHUB_TOKEN }}"
    directory: bucket
    homepage: https://github.com/JoshiMinh/aifiler
    description: AI-powered local-first file management copilot.
    license: MIT
